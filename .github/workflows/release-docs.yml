name: Update Release descriptions
on:
  push:
    branches: [main]
    paths:
      - 'release-notes/*.md'
      - '.github/workflows/release-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update published descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          for path in sorted(Path('release-notes').glob('*.md')):
              tag = path.stem
              expected = path.read_text()
              subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--notes-file', str(path)], check=True)
              raw = subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}'], text=True)
              assert json.loads(raw)['body'] == expected, f'Description mismatch: {tag}'
              print(f'Updated and verified {tag}')
          PY
