name: Build vrcrp iOS and Android
on:
  push:
    branches: [main, vrcrp-web-ios]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/release-docs.yml'
      - 'release-version-map.json'
      - 'scripts/normalize-release-versions.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check notification previews and live refresh
        run: node scripts/test-notifications.cjs
      - name: Check data coherence and cache races with real TanStack Query
        run: |
          npm install --prefix build/verification-deps --no-package-lock --no-save @tanstack/query-core@5.104.1
          TEST_NODE_MODULES="$PWD/build/verification-deps/node_modules" node scripts/test-live-cache.cjs
      - name: Build arm64 device application
        run: bash scripts/build-unsigned.sh
      - name: Verify unsigned device binary
        run: |
          file build/Payload/ERPStable.app/ERPStable
          lipo build/Payload/ERPStable.app/ERPStable -verify_arch arm64
          if codesign -dv build/Payload/ERPStable.app 2>/dev/null; then
            echo 'Unexpected code signature' >&2
            exit 1
          fi
          unzip -t build/ERPStable-unsigned.ipa
          test -d build/Payload/ERPStable.app/LaunchScreen.storyboardc
          test -f build/Payload/ERPStable.app/AppIcon60x60@3x.png
          test -f build/Payload/ERPStable.app/app-theme.js
          test "$(plutil -extract UIBackgroundModes.0 raw build/Payload/ERPStable.app/Info.plist)" = audio
          test ! -e build/Payload/ERPStable.app/swipe-feedback.js
          plutil -extract CFBundleDisplayName raw build/Payload/ERPStable.app/Info.plist
          shasum -a 256 build/ERPStable-unsigned.ipa > build/SHA256.txt
      - name: Check keyboard, navigation, card spacing and status bar in iOS Simulator
        run: bash scripts/simulator-check.sh
      - name: Check real profile touch gestures and stalled screenshot recovery
        run: bash scripts/simulator-touch-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrcrp-web-unsigned
          path: |
            build/ERPStable-unsigned.ipa
            build/SHA256.txt
            build/notification-content.json
            build/live-cache-verification.json
            build/layout-first.json
            build/layout-reopened.json
            build/web-keyboard.png
            build/web-login.png
            build/tabs-tabs.json
            build/tabs-modal.json
            build/tabs-restored.json
            build/tabs-immediate.json
            build/app-tabs.png
            build/ux-*.json
            build/app-ux.png
            build/navigation-*.json
            build/handoff-*.json
            build/handoff.mov
            build/handoff-record.log
            build/continuity-*.json
            build/continuity-*.png
            build/continuity.mov
            build/continuity-record.log
            build/motion-*.json
            build/surfaces-*.json
            build/surfaces-*.png
            build/app-motion.png
            build/simulator-timeout.png
            build/simulator-timeout.log
            build/touch-tests.log
            build/touch-native.log
            build/feedback-*.json
            build/feedback-*.png
            build/background-listening.json
            build/preference-state.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrcrp-native-touch-results
          path: |
            build/touch-results.xcresult
            build/touch-attachments
          if-no-files-found: warn
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: android/.signing/debug.keystore
          key: vrcrp-android-development-signing-v2
      - name: Build installable Android APK and run lint
        run: bash scripts/build-android.sh
      - name: Verify APK signature and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/vrcrp-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/vrcrp-android.apk
          unzip -t build/vrcrp-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrcrp-android
          path: |
            build/vrcrp-android.apk
            android/app/build/reports/lint-results-release.*
          if-no-files-found: error
  shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          mkdir -p build/verification-deps
          cp scripts/browser-checks-package.json build/verification-deps/package.json
          npm install --prefix build/verification-deps --no-package-lock
          python3 -m pip install playwright
          python3 -m playwright install --with-deps webkit
      - name: Verify languages, chat pinning and unread coherence
        run: |
          TEST_NODE_MODULES="$PWD/build/verification-deps/node_modules" python3 scripts/test-v017-ui.py
          TEST_NODE_MODULES="$PWD/build/verification-deps/node_modules" node scripts/test-live-cache.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrcrp-shared-ui-checks
          path: |
            build/v017-ui.json
            build/live-cache-verification.json
  release:
    if: github.repository != 'lolo-desu/Action-Build' && github.ref == 'refs/heads/main'
    needs: [build, android, shared-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vrcrp-web-unsigned
          path: release-build
      - uses: actions/download-artifact@v4
        with:
          name: vrcrp-android
          path: android-build
      - name: Publish verified IPA and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('ERPStable/Info.plist','rb'))['CFBundleShortVersionString'])")
          cp release-build/ERPStable-unsigned.ipa "vrcrp-v${VERSION}-unsigned.ipa"
          cp android-build/build/vrcrp-android.apk "vrcrp-v${VERSION}-android.apk"
          sha256sum "vrcrp-v${VERSION}-unsigned.ipa" "vrcrp-v${VERSION}-android.apk" > SHA256.txt
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Version v${VERSION} already published; increment the version before publishing again."
            exit 1
          fi
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "vrcrp ${VERSION}" \
            --notes-file RELEASE_NOTES.md --draft "vrcrp-v${VERSION}-unsigned.ipa" "vrcrp-v${VERSION}-android.apk" SHA256.txt
          gh release edit "v${VERSION}" --draft=false
