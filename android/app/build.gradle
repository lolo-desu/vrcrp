plugins { id 'com.android.application' }
android {
    namespace 'com.vrcrp.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vrcrp.app'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '0.18'
    }
    buildTypes {
        release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug }
        debug { debuggable true }
    }
    sourceSets.main.assets.srcDirs = ['src/main/assets', '../../ERPStable']
    sourceSets.main.assets.exclude '**/*.m', '**/*.h', '**/*.plist', '**/*.entitlements', '**/*.storyboard', '**/*.png'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
